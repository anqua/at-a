<div class="news-list">
{% assign years = site.data.news | map: "year" | uniq | sort | reverse %}
{% for y in years %}
<h2 class="news-year">{{ y }}</h2>
<ul class="news-items">
{% assign items = site.data.news | where: "year", y %}
{% for item in items %}
  <li><strong>{{ item.date }}</strong> — {{ item.html }}</li>
{% endfor %}
</ul>
{% endfor %}
</div>
