- name: Elizabeth Jochum
  role: Visiting researcher, October 2026
  affiliation: Aalborg University, Denmark | RA Capital, Boston
  photo: /at-a/assets/images/photo_Elizabeth.jpg
  bio: "Associate professor of Robotics and Art at Aalborg University (RELATE Research Laboratory for Art Technology) and director of robotics and automation at the investment fund RA in Boston. Her research uses the visual and performing arts as catalysts for rethinking how we design and implement robots and assistive technologies, from industrial robot arms to dancing exoskeletons."
  links:
    - label: Aalborg University
      url: https://vbn.aau.dk/en/persons/elizabeth-jochum
    - label: RA Capital
      url: https://www.racap.com/team/elizabeth-jochum

- name: E.G. Kraft | 可拉符 永治
  role: Visiting researcher, November 2026
  affiliation: Tokyo / Vienna
  photo: /at-a/assets/images/photo_Kraft.jpg
  bio: "Conceptual artist and researcher of sociotechnical cultures, splitting his time between Western Europe and Eastern Asia. His award-winning work has been exhibited in museums, galleries and festivals worldwide, and addresses the modern condition as an outcome of techno-social, material and econometric dynamics."
  links:
    - label: Website
      url: https://kraft.studio

- name: Christiane (Candy) M. Herr
  role: Speaker, meta-TOPIAS symposium, May 2026
  affiliation: School of Design, SUSTech
  photo: /at-a/assets/images/photo_Candy.jpg
  bio: "Tenured professor and founding member of the School of Design at the Southern University of Science and Technology (SUSTech), Shenzhen. She founded the Future Ecologies Research Group, which examines the intersection of ecology and technology in building facades, with an emphasis on the local context of China. Past President of CAADRIA and Vice-Chair of CAADFutures. Her talk: New Human-Nature Relationships in the City."
  links:
    - label: SUSTech
      url: https://www.sustech.edu.cn/en/

- name: Thomas Fischer
  role: Speaker, meta-TOPIAS symposium, May 2026
  affiliation: School of Design, SUSTech
  photo: /at-a/assets/images/photo_Tom.jpg
  bio: "Professor at the School of Design at SUSTech and leader of its Design Cybernetics Group. Design educator and researcher, with previous teaching posts at The Hong Kong Polytechnic University and Xi'an Jiaotong-Liverpool University. Fellow of the Design Research Society and of the Cybernetics Society, and recipient of the American Society for Cybernetics' Warren McCulloch Award. His research focuses on design computing, design cybernetics, design geometry and digital media. His talk: Media Archaeology + Cybernetic Machines."
  links:
    - label: SUSTech
      url: https://www.sustech.edu.cn/en/

- name: Quanle Huang
  role: Speaker, meta-TOPIAS symposium, May 2026
  affiliation: Architecture School, Guangzhou Academy of Arts
  bio: "Associate professor at the Architecture School of the Guangzhou Academy of Arts. Their talk: Where Water Flows, Prosperity Grows."

- name: Shavei Zhang
  role: Speaker, meta-TOPIAS symposium, May 2026
  affiliation: Landscape Architecture School, Guangzhou Academy of Arts
  bio: "Associate professor and head of the Landscape Architecture School at the Guangzhou Academy of Arts. Their talk: Urban Vitality Phase Transition Mechanisms."
