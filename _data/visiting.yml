- name: Elizabeth Jochum
  role: Visiting researcher, October 2026
  affiliation: Aalborg University, Denmark | RA Capital, Boston
  photo: /at-a/assets/images/photo_Elizabeth_pad.jpg
  bio: "<a href='https://vbn.aau.dk/en/persons/elizabeth-jochum' target='_blank' rel='noopener'>Associate professor of Robotics and Art</a> at Aalborg University (RELATE Research Laboratory for Art Technology) and <a href='https://www.racap.com/team/elizabeth-jochum' target='_blank' rel='noopener'>director of robotics and automation</a> at the investment fund RA in Boston. Her research uses the visual and performing arts as catalysts for rethinking how we design and implement robots and assistive technologies, from industrial robot arms to dancing exoskeletons."

- name: E.G. Kraft | 可拉符 永治
  role: Visiting researcher, November 2026
  affiliation: Tokyo / Vienna
  photo: /at-a/assets/images/photo_Kraft_pad.jpg
  bio: "Conceptual artist and researcher of sociotechnical cultures, splitting his time between Western Europe and Eastern Asia. His <a href='https://kraft.studio' target='_blank' rel='noopener'>award-winning work</a> has been exhibited in museums, galleries and festivals worldwide, and addresses the modern condition as an outcome of techno-social, material and econometric dynamics."

- name: Christiane (Candy) M. Herr
  role: Speaker, meta-TOPIAS symposium, May 2026
  affiliation: School of Design, SUSTech
  photo: /at-a/assets/images/photo_Candy.jpg
  bio: "<a href='https://designschool.sustech.edu.cn/about/team/faculty/363.html' target='_blank' rel='noopener'>Tenured professor and founding member</a> of the School of Design at the Southern University of Science and Technology (SUSTech), Shenzhen. She founded the Future Ecologies Research Group, which examines the intersection of ecology and technology in building facades, with an emphasis on the local context of China. Past President of CAADRIA and Vice-Chair of CAADFutures. Her talk: New Human-Nature Relationships in the City."

- name: Thomas Fischer
  role: Speaker, meta-TOPIAS symposium, May 2026
  affiliation: School of Design, SUSTech
  photo: /at-a/assets/images/photo_Tom.jpg
  bio: "<a href='https://designschool.sustech.edu.cn/about/team/faculty/364.html' target='_blank' rel='noopener'>Professor</a> at the School of Design at SUSTech and leader of its Design Cybernetics Group. Design educator and researcher, with previous teaching posts at The Hong Kong Polytechnic University and Xi'an Jiaotong-Liverpool University. Fellow of the Design Research Society and of the Cybernetics Society, and recipient of the American Society for Cybernetics' Warren McCulloch Award. His research focuses on design computing, design cybernetics, design geometry and digital media. His talk: Media Archaeology + Cybernetic Machines."

- name: Quanle Huang
  role: Speaker, meta-TOPIAS symposium, May 2026
  affiliation: Faculty of Architecture & Applied Arts, Guangzhou Academy of Fine Arts
  photo: /at-a/assets/images/photo_Quanle.jpg
  bio: "Associate professor at the Faculty of Architecture & Applied Arts of the Guangzhou Academy of Fine Arts, where she was head of the Department of Architecture from 2019 to 2025. She holds a PhD in Architecture from the University of Paris 8 and a Master's degree from the South China University of Technology, and worked for many years at its Architectural Design & Research Institute. Her research covers urban spatial typology, urban design, urban renewal and public architecture design. Her talk: Where Water Flows, Prosperity Grows: A Comparative Study of Urban-Water Symbiosis."

- name: Shavei Zhang
  role: Speaker, meta-TOPIAS symposium, May 2026
  affiliation: Faculty of Architecture & Applied Arts, Guangzhou Academy of Fine Arts
  photo: /at-a/assets/images/photo_Shavei.jpg
  bio: "Associate professor at the Faculty of Architecture & Applied Arts of the Guangzhou Academy of Fine Arts, head of the Department of Landscape Architecture, and Deputy Secretary General of the Guangdong Specialized Committee of Landscape Architecture Education Information. Her research focuses on the Pearl River Delta, combining historical GIS, remote sensing and multi-source spatial data to study how regional cultural heritage adapts and how cultural landscapes evolve, bringing urban science and complex systems theory to the question of how cultural heritage stays resilient. Her talk: Urban Vitality Phase Transition Mechanisms in Brownfield Transformation: A Spatiotemporal Percolation Perspective."
