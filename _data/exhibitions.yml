- id: rom-ai-nians
  title: "The Rom(AI)nians"
  venue: "Galeria Aparte"
  location: "Iași, Romania"
  year: 2026
  credits: "Anca-Simona Horvath and Mihai Aureliu Savin"
  description: ""
  description_long:
    - "The project investigates the transformation of contemporary political advertising into an algorithmically optimized visual product, situated at the intersection of artificial intelligence, the attention economy, and collective imaginary. The materials circulated online in Romania between October 2024 and May 2026, starting during the period of the country's presidential elections, and following a period of political turmoil, are approached not only as ideological vehicles, but also as symptoms of a new political aesthetic in which nostalgia, spirituality, social anxiety, nature, and national identity become reusable visual elements."
    - "Through an art-based research methodology, combining archiving, participatory observation, visual analysis, and installation-based production. The starting point consists of an archive of images and texts collected from politically targeted social media feeds. These materials function simultaneously as historical documents, exposing political imagery at an important time in the country's history, and as indicators of the technological state of AI image generation during that period. Many of the images occupy a zone close to the uncanny valley: mixing the familiar and affective, while remaining sufficiently artificial to produce ambiguity and discomfort."
    - "The project proposes relocating these images from the digital sphere, volatile, accelerated, and semi-public, into the exhibition space, where the feed becomes object, archive, and installation. Through this remediation, the images lose their immediate persuasive function and become available for visual analysis and critical contextualization. Contemporary materials are juxtaposed with historical aesthetics of political advertising and representation in order to highlight continuities and mutations in the construction of the collective imaginary."
    - "Starting January 2026, we created two surrogate profiles of Facebook with the aim of observing informational bubbles \"from within\" and to analyze the ways algorithms personalize and distribute political content. The exhibition includes participatory mechanisms through which visitors are invited to assume these two counterfactual identities, both directly through Facebook profiles accessible on two laptops displayed in the gallery, and symbolically through a selfie cut-out point installed outside the exhibition space. The visitor is simultaneously positioned as spectator, user, and potential agent in the circulation of images."
    - "A central element of the project is the continuous, real-time production of 3D-printed busts based on the images of Călin Georgescu and Cristela Georgescu. The process functions as a material metaphor for the automated reproduction of public figures in the online environment and for the ways in which political identity is fabricated, multiplied, and stabilized through the continuous distribution of images."
  press: "https://www.modernism.ro/2026/05/23/expozitie-anca-horvath-mihai-aureliu-savin-the-romainians-galeria-aparte-unage-iasi/"
  url: /at-a/exhibitions/the-romainians/
  cover: /at-a/assets/images/Logo_AtA.png

- id: blooming-archive
  title: "The Blooming Archive"
  venue: "Central Saint Martins — Creativity and Cognition, Art Track"
  location: "London, UK"
  year: 2026
  credits: "Yawei Zhao, Zheng Yuan, Jiang Ke, Zuona Chen, Jieyu Wang, Anca-Simona Horvath and Pan Hui"
  description: "By inviting audiences to interact with evolving digital orchids, each accompanied by inspectable lineage traces and relational links, represented by real DNA data, this artwork makes orchid biological data legible as a situated encounter. The Blooming Archive invites audiences to reflect on (1) how classifications in the sciences of the natural world are produced, and (2) how global trade and asymmetries of power have historically shaped these classification practices. The Blooming Archive deals with human-plant relations and aims to spark conversations on how to reconceive the ways in which humans relate to other species and inform more-than-human centred design practices."
  url: /at-a/exhibitions/the-blooming-archive/
  cover: /at-a/assets/images/exhibitions/blooming-archive/01-overview.jpg
