- id: Horvath2022a
  type: dataset
  authors: "Anca-Simona Horvath"
  title: "ComPara: A Corpus Linguistics Dataset of Computation in Architecture"
  year: 2022
  publisher: "Mendeley Data"
  doi: "10.17632/7ktscvmxvg.5"
  description: "A dataset containing titles of journal issues, and article titles from the journal Architectural Design (2005-2024) and the titles and abstracts of winning projects and honourable mentions of the eVolo skyscraper competition (2006-2024). This can be used in prompt engineering or in training AI models with language that is specific to the field of architecture."

- id: Pouliou2022
  type: dataset
  authors: "Panagiota Pouliou, Anca-Simona Horvath, George Palamas"
  title: "Annotated Point Clouds of Buildings: A segmented dataset of single-family houses"
  year: 2022
  publisher: "Mendeley Data"
  doi: "10.17632/3thtp7mc6z.1"
  description: "A dataset containing 2.904 geometries of single-family houses in the form of annotated Point Clouds. The geometries are segmented in 3 classes: wall, roof, floor. The points of the point clouds are saved in .pts files while their labels are saved in .seg files. The dataset can be used to train 3D Generative Adversarial Neural Networks (GANs) for architectural applications, with architecturally relevant data."
