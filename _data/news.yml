- year: 2026
  date: "June 2026"
  html: >-
    really proud that two of our group members - Yawei and Lei (Simon)
    successfully presented and defended their PhD qualification
    examinations and are now on track towards submitting their PhDs.

- year: 2026
  date: "Jun 2026"
  html: >-
    it's finally out, after more than three years in the making! check out
    the special issue on <a href="https://raco.cat/index.php/Artnodes/about/call-for-papers-no-disciplinari"
    target="_blank" rel="noopener">Un-disciplinary: Entangled ways of
    seeing, knowing and doing</a> in the journal
    <a href="https://raco.cat/index.php/Artnodes/about/" target="_blank"
    rel="noopener">ArtNodes</a>. This builds on the
    <a href="https://www.youtube.com/watch?v=m4Iat5GsrV0" target="_blank"
    rel="noopener">Un-disciplinary</a> symposium and art exhibition
    organized in Aalborg in 2023, and funded by
    <a href="https://novonordiskfonden.dk/en/" target="_blank"
    rel="noopener">Novo Nordisk Fonden</a>

- year: 2026
  date: "May 2026"
  html: >-
    editing a special issue under the theme
    <a href="https://www.sciencedirect.com/journal/design-and-artificial-intelligence/about/call-for-papers"
    target="_blank" rel="noopener">Design and Education in the Age of
    Artificial Intelligence</a> in the journal
    <a href="https://www.sciencedirect.com/journal/design-and-artificial-intelligence"
    target="_blank" rel="noopener">Design and Artificial Intelligence</a>.

- year: 2026
  date: "May 2026"
  html: >-
    Spring semester exhibition and symposium at Computational Media and
    Arts, HKUST-gz showcasing student work across multiple courses.
    <a href="/at-a/assets/activities/Poster%20-%20exhibitions%20-%20symposium.pdf"
    target="_blank" rel="noopener">See more here.</a>

- year: 2026
  date: "Mar 2026"
  html: >-
    Yujie Liu (Jessie), with a background in English literature, just
    joined @A as an Mphil student. She will work on digital humanities,
    generative AI, and human-computer interaction. Welcome Yujie!

- year: 2026
  date: "Mar 2026"
  html: >-
    Lei Han (Simon), master's graduate from HKUST-gz, and with a
    background in fine arts from the Chinese Academy of Fine Arts (CAFA)
    joined @A as a co-supervised PhD candidate (with prof. David Yip as
    main supervisor). His work focuses on AI mediated learning about
    built cultural heritage. Welcome Simon!

