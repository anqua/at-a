  date: "Jan 2026"
  html: >-
    editing a special issue under the theme
    <a href="https://raco.cat/index.php/Artnodes/about/call-for-papers-no-disciplinari"
    target="_blank" rel="noopener">Un-disciplinary: Entangled ways of
    seeing, knowing and doing</a> in the journal
