- year: 2026
  date: "Jan 2026"
  html: >-
    Chloe Zhu, a recent master's graduate of Architecture from Chalmers
    University, just joined @A as a PhD student. She will work on
    developing a new material system combining Bio-rock technology with
    reclaimed seashell concrete. Welcome Chloe!

- year: 2026
  date: "Jan 2026"
  html: >-
    Lucky John Tutor, recent master's graduate from HKUST-gz, just joined
    @A as a PhD student. He will work on 4D printing actuators for
    origami/kirigami structures to be used as facade elements. Welcome
    Lucky!

- year: 2025
  date: "Dec 2025"
  html: >-
    The group is growing fast: Xiaojing Liang joined in early December as
    an admin guru. Welcome Xiaojing!

- year: 2025
  date: "Dec 2025"
  html: >-
    Yunwei Li, recent master graduate of Design from Tsinghua University
    joins @A as Research Assistant. Yunwei will work on combining design
    for sustainability with design for play, building on her ideas of
    history-as-design. Welcome Yunwei!

- year: 2025
  date: "Nov 2025"
  html: >-
    talk on <a href="https://mp.weixin.qq.com/s/cJqItKSQhdcrjMCkMWmffA"
    target="_blank" rel="noopener">AI and bio-materials for design</a> at
    the Sichuan Fine Arts Institute

- year: 2025
  date: "Nov 2025"
  html: >-
    participated in the <a href="https://artsit.eai-conferences.org/2025/"
    target="_blank" rel="noopener">14th EAI International Conference:
    ArtsIT, Interactivity & Game Creation</a> conference which took place
    in Dubai, and chaired a special track on
    <a href="https://artsit.eai-conferences.org/2025/call-for-special-track-papers-on-art-and-design-in-the-ai-era/"
    target="_blank" rel="noopener">Art and Design in the AI Era: New
    Creative Practices, Data Curation, and Automation</a>

- year: 2025
  date: "Nov 2025"
  html: >-
    participated in the <a href="https://diaspora-stiintifica.ro/"
    target="_blank" rel="noopener">SMART Diaspora</a> conference in Cluj,
    Romania, a bi-annual conference that brings together the Romanian
    scientific diaspora and was part of a workshop/panel called
    <a href="https://www.linkedin.com/feed/update/urn:li:activity:7396896105701085184/"
    target="_blank" rel="noopener">The impact of design and the visual
    arts in contemporary society</a>

- year: 2025
  date: "Nov 2025"
  html: >-
    Stella Huang, recent master graduate of Creative Media from CityU
    joins @A as a Research Assistant. Stella will work on two projects
    investigating video-based social media content: one on Urban to Rural
    migration, and the second on (techno-)feminism. Welcome Stella!

- year: 2025
  date: "Oct 2025"
  html: >-
    tocco.earth, one of the main platforms on bio-materials, featured our
    work: <a href="https://tocco.earth/article/ai-pushes-material-choice-upstream-from-geometry-to-lca"
    target="_blank" rel="noopener">AI Pushes Material Choice Upstream,
    From Geometry to LCA</a>

- year: 2025
  date: "Oct 2025"
  html: >-
    took part in a trip across China to see industrial production sites
    for robotics, new materials, and bio-technologies, organized by
    <a href="https://tocco.earth/" target="_blank" rel="noopener">tocco.earth</a>

- year: 2025
  date: "Oct 2025"
  html: >-
    gave a talk at SUStech school of Design on
    <a href="https://www.linkedin.com/feed/update/urn:li:activity:7381562066630840320/"
    target="_blank" rel="noopener">Ecologies of Care and Language as
    Design material</a>

- year: 2025
  date: "Sept 2025"
  html: >-
    The first two group members join @A: Yawei Zhao and Yufeng Zeng, both
    co-supervised PhD students (Yawei with prof. Pan Hui and Yufeng with
    prof. Chen Liang - both from Computational Media and Arts at
    HKUST-gz). Yawei works with mixed reality for reactivating public
    space, while Yufeng works with Creativity Support Tools. Welcome both!

- year: 2025
  date: "August 2025"
  html: >-
    group founded at the Hong Kong University of Science and Technology,
    Guangzhou campus
